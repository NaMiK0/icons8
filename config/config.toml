# Конфигурация генератора лендингов.
#
# Здесь живёт всё, что может меняться от прогона к прогону: бренд, пороги,
# целевое число страниц, модели, переключатели. Код этих значений не знает —
# это и есть требование «отработать на другой выгрузке без правки кода».
#
# Приоритет значений: флаг командной строки > этот файл > встроенный дефолт.
# У каждого переключателя из [run] и [render] есть флаг, меняющий его на один
# запуск; флаги перечислены рядом. Полный список: python run.py --help

# ---------------------------------------------------------------------------
# Переключатели запуска
# ---------------------------------------------------------------------------

[run]
# Обращаться к языковой модели.
#   true  — классификация, кластеризация и тексты делаются моделью
#   false — офлайн-режим: правила, лексическая кластеризация, шаблонные тексты;
#           ключ API не нужен, прогон занимает доли секунды
# Флаги на один запуск: --llm / --no-llm
use_llm = true

# Брать ответы модели из дискового кэша (.cache/llm).
#   true  — повторный прогон на тех же данных бесплатен и даёт те же страницы
#   false — каждый запрос уходит в модель заново; ответы будут немного другими
# Флаги на один запуск: --cache / --no-cache
use_cache = true

# Запросы своего бренда (icons8, icon8, 8icons…).
#   false — отбрасываются: по ним сайт уже в топ-3, новая страница не поможет
#   true  — остаются и могут попасть на страницы
# Флаги на один запуск: --keep-brand / --no-keep-brand
keep_brand = false

# Чужие торговые марки и связанные с ними символы (instagram logo, blue tick…).
#   false — отбрасываются: лендинг под чужую марку — юридическое решение
#   true  — остаются и могут попасть на страницы
# Флаги на один запуск: --keep-third-party / --no-keep-third-party
keep_third_party = false

[render]
# Внутренняя аналитика на страницах: таблица «Searches covered by this page»
# с кликами, показами и позициями, метрики и сводка исключений на хабе.
#   true  — показывать; удобно при проверке: видно, из чего собрана страница
#   false — скрыть; для публикации, свои метрики наружу не показывают
# Флаги на один запуск: --metrics / --no-metrics
show_search_metrics = true

# ---------------------------------------------------------------------------
# Сайт и рынок
# ---------------------------------------------------------------------------

[site]
name = "Icons8"
# Используется для canonical и og:url на сгенерированных страницах.
base_url = "https://icons8.com/"
# Что считается каталогом. Этой фразой модель решает, какие запросы годятся
# для лендинга: всё, что за её пределами (инструменты, фото, музыка), будет
# отброшено как не относящееся к каталогу. Поменять охват — поменять фразу.
business = "a catalog of design assets: icons, illustrations and 3D graphics"

[market]
# Рынок англоязычный: запросы на других языках отбрасываются.
language = "en"
# Слова, по которым язык виден без полного словаря. Нелатинские алфавиты
# ловятся отдельным правилом, этот список — про латиницу: польский,
# испанский, немецкий, турецкий и прочие «download» на своём языке.
non_english_markers = [
  "pobrania", "myszki", "kursor", "darmowe",
  "descargar", "gratis", "gratuit", "telecharger", "kostenlos", "herunterladen",
  "scarica", "baixar", "bedava", "indir", "unduh", "gratuito", "iconos",
]

[brand]
# Навигационные запросы своего бренда. Сравнение идёт по строке, из которой
# удалены пробелы и пунктуация, плюс допуск на опечатку в fuzzy_distance
# символов — поэтому список короткий, а ловит он и "icons 8", и "icon8. com".
# Правило срабатывает только на запросах с цифрой: без этого «icons»
# (15 тысяч кликов, самый ценный общий запрос) отличался бы от «icons8» на
# одну букву и был бы отброшен как брендовый.
aliases = ["icons8", "icon8", "8icons", "8icon"]
fuzzy_distance = 1
# Названия собственных продуктов. Сравниваются как слова целиком, без
# нечёткого поиска: «lunacy» — это приложение Icons8, а не спрос на ассеты.
products = ["lunacy", "pichon", "mega creator"]

# ---------------------------------------------------------------------------
# Объём работы
# ---------------------------------------------------------------------------

[input]
# Сколько запросов брать из выгрузки после склейки дублей. Остальные попадают
# в excluded.csv с причиной truncated. Флаг: --max-queries N
max_queries = 500
# Порог показов, ниже которого запрос не рассматривается (0 — правило выключено).
min_impressions = 0

[pages]
# Сколько лендингов собрать. Флаг: --target-pages N
target = 10
# Допустимое отклонение: меньше target - tolerance страниц собирается, только
# если данных на большее не хватает. Флаг: --tolerance N
tolerance = 2
# Кластер из меньшего числа запросов считается слабым и берётся в последнюю очередь.
min_queries_per_cluster = 2

# ---------------------------------------------------------------------------
# Модели
# ---------------------------------------------------------------------------

[models]
# Цепочка моделей на каждую стадию: первая — основная, следующие — запасные.
# Если модель не ответила или ответила негодным JSON три раза подряд, стадия
# переходит к следующей; если не ответила ни одна — к правилам и шаблонам.
# Первую модель стадии можно подменить на один запуск переменными
# LLM_MODEL_CLASSIFY, LLM_MODEL_CLUSTER, LLM_MODEL_CONTENT из .env.
#
# Классификация — массовая механическая задача: на ней Flash и 27B совпали в
# 13 решениях из 14, а Flash в четыре раза дешевле.
classify = ["qwen/qwen3.5-flash-02-23", "qwen/qwen3.5-27b"]
# Кластеризация и тексты требуют суждения и хорошего английского.
cluster = ["qwen/qwen3.5-27b", "qwen/qwen3.5-flash-02-23"]
content = ["qwen/qwen3.5-27b", "qwen/qwen3.5-flash-02-23"]

[llm]
# 0 уменьшает разброс, но не убирает его: на одних и тех же данных модель
# между прогонами всё равно иногда меняет решения. Воспроизводимость
# обеспечивает кэш, а не температура.
temperature = 0
# Повторы при сетевых ошибках и ответах 429/5xx.
max_retries = 4
# Сколько запросов уходит в модель за один вызов классификации.
batch_size = 50
timeout = 300
max_tokens = 16000
# Размышления выключены по замеру на qwen3.5-27b: с ними классификация шла
# 301 c против 51 c и стоила вдвое дороже, а решения лучше не стали. Для
# раскладки по закрытому списку меток рассуждать не нужно.
# Включить обратно: LLM_REASONING_EFFORT=medium в .env.
reasoning_effort = "none"

# ---------------------------------------------------------------------------
# Офлайн-режим
# ---------------------------------------------------------------------------

[offline]
# Грубые маркеры для режима без модели. В обычном режиме решение принимает
# модель, здесь — только чтобы офлайн-прогон не выглядел совсем наивным.
third_party_markers = [
  "instagram", "apple", "tiktok", "shein", "shazam", "phonepe", "whatsapp",
  "facebook", "youtube", "netflix", "blue tick", "verified badge", "blue check",
]
non_landing_markers = ["injector", "apk", "mod", "hack", "trends", "how to", "what is"]
