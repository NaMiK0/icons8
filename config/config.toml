# Конфигурация генератора лендингов.
#
# Здесь живёт всё, что может меняться от прогона к прогону: бренд, пороги,
# целевое число страниц, модели. Код этих значений не знает — это и есть
# требование «отработать на другой выгрузке без правки кода».
#
# Приоритет значений: флаг CLI > этот файл > встроенный дефолт в коде.

[site]
name = "Icons8"
# Используется для canonical и og:url на сгенерированных страницах.
base_url = "https://icons8.com/"

[market]
# Рынок англоязычный: запросы на других языках отбрасываются.
language = "en"
# Слова, по которым язык виден без полного словаря. Нелатинские алфавиты
# ловятся отдельным правилом, этот список — про латиницу: польский,
# испанский, немецкий, турецкий и прочие «download» на своём языке.
non_english_markers = [
  "pobrania", "myszki", "kursor", "darmowe",
  "descargar", "gratis", "gratuit", "telecharger", "kostenlos", "herunterladen",
  "scarica", "baixar", "bedava", "indir", "unduh", "gratuito",
]

[brand]
# Навигационные запросы своего бренда. Сравнение идёт по строке, из которой
# удалены пробелы и пунктуация, плюс допуск на опечатку в fuzzy_distance
# символов — поэтому список короткий, а ловит он и "icons 8", и "icon8. com".
aliases = ["icons8", "icon8", "8icons", "8icon"]
fuzzy_distance = 1

[input]
# Сколько запросов брать из выгрузки после склейки дублей.
max_queries = 500
# Порог показов, ниже которого запрос не рассматривается (0 — правило выключено).
min_impressions = 0

[pages]
target = 10
tolerance = 2
min_queries_per_cluster = 2

[models]
# Значения переопределяются переменными LLM_MODEL_* из .env.
# Классификация — массовая механическая задача, идёт на дешёвой модели.
classify = "qwen/qwen3.5-flash-02-23"
# Кластеризация и копирайт требуют суждения и хорошего английского.
cluster = "qwen/qwen3.5-27b"
content = "qwen/qwen3.5-27b"

[llm]
temperature = 0
max_retries = 4
batch_size = 50
cache = true
timeout = 300
max_tokens = 16000
# Размышления выключены по результатам замера на qwen3.5-27b: с ними одна
# стадия классификации шла 301 c против 51 c и стоила вдвое дороже, а решения
# были хуже — модель отбрасывала «icon maker» и «icon finder» как «не лендинг».
# Для раскладки по закрытому списку меток рассуждать не нужно.
# Включить обратно: LLM_REASONING_EFFORT=medium в .env.
reasoning_effort = "none"

[offline]
# Грубые маркеры для режима --no-llm. В обычном режиме решение принимает модель,
# здесь — только чтобы офлайн-прогон не выглядел совсем наивным.
third_party_markers = [
  "instagram", "apple", "tiktok", "shein", "shazam", "phonepe", "whatsapp",
  "facebook", "youtube", "blue tick", "verified badge", "blue check",
]
non_landing_markers = ["injector", "apk", "mod", "hack", "trends 20"]
